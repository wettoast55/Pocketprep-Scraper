<svg xmlns="http://www.w3.org/2000/svg" width="760" height="490" viewBox="0 0 760 490"><rect width="760" height="490" rx="12" fill="#f5f7fa"/><g font-family="Segoe UI, Arial, sans-serif" fill="#20344a"><text x="24" y="48" font-size="26" font-weight="600">Install in Edge or Chrome</text><text x="24" y="72" font-size="12" fill="#52667a">Illustrated guide • Exam Study Library</text><rect x="24" y="90" width="712" height="74" rx="10" fill="white" stroke="#c9d4df"/><text x="44" y="119" font-size="18" font-weight="600">1  Download</text><text x="44" y="145" font-size="15" fill="#52667a">Newest release → Assets → extension ZIP</text><rect x="24" y="182" width="712" height="74" rx="10" fill="white" stroke="#c9d4df"/><text x="44" y="211" font-size="18" font-weight="600">2  Extract</text><text x="44" y="237" font-size="15" fill="#52667a">Keep the extension in a permanent folder</text><rect x="24" y="274" width="712" height="74" rx="10" fill="white" stroke="#c9d4df"/><text x="44" y="303" font-size="18" font-weight="600">3  Enable Developer mode</text><text x="44" y="329" font-size="15" fill="#52667a">edge://extensions or chrome://extensions</text><rect x="24" y="366" width="712" height="74" rx="10" fill="white" stroke="#c9d4df"/><text x="44" y="395" font-size="18" font-weight="600">4  Load unpacked</text><text x="44" y="421" font-size="15" fill="#52667a">Select the folder containing manifest.json</text></g></svg>