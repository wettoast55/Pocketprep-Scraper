<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="library.css" />
    <title>Exam Study Library</title>
  </head>
  <body class="popup">
    <h1>Exam Study Library</h1>
    <button id="open">Open exam library</button>
    <h2>Pocket Prep collector</h2>
    <label for="exam">Exam name</label
    ><input id="exam" autocomplete="off" /><label for="total"
      >Expected distinct questions</label
    ><input id="total" type="number" min="1" max="20000" autocomplete="off" />
    <label for="version">Exam version / code (optional)</label
    ><input id="version" autocomplete="off" />
    <label for="version-date">Source version date (optional)</label
    ><input id="version-date" autocomplete="off" />
    <button id="collect">Open collector on this page</button>
    <p id="status" role="status">
      Sign in to Pocket Prep normally, then open a question. Collection stays on
      this device.
    </p>
    <script src="page-metadata.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
